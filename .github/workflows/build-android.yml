name: Build Android (mortgage-ui)

# Builds crates/mortgage-ui for Android. Always produces a debug-signed APK
# (works for sideloading/testing). If the ANDROID_KEYSTORE_BASE64 secret is
# configured (see crates/mortgage-ui/DEPLOY.md), it additionally produces a
# release-signed APK + AAB suitable for Play Console upload.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NDK_VERSION: "27.0.12077973"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + build-tools
        run: sdkmanager --install "ndk;${NDK_VERSION}" "build-tools;34.0.0" "platforms;android-34"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/mortgage-ui -> target

      - name: Install dioxus-cli
        run: cargo install dioxus-cli --locked

      - name: Build release .so + debug-signed APK
        working-directory: crates/mortgage-ui
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: dx bundle --platform android --package-types apk --release

      - name: Upload debug-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: mortgage-ui-debug-signed.apk
          path: crates/mortgage-ui/dist/*.apk

      - name: Decode release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.keystore

      - name: Build release-signed APK + AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: crates/mortgage-ui
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          ANDROID_KEYSTORE_PATH: /tmp/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/build-android-release.sh

      - name: Upload release-signed APK + AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mortgage-ui-release-signed
          path: |
            crates/mortgage-ui/dist/mortgage-ui-release.apk
            crates/mortgage-ui/dist/mortgage-ui-release.aab
