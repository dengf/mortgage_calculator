name: CI

# Everything here runs on Linux. It used to run on macOS, because the Slint
# crate built a macOS app, an iOS binary and a .icns, and none of that
# cross-compiles. With the native targets gone the whole workspace is
# platform-independent Rust plus a wasm32 build, and GitHub bills a macOS
# minute at ten times a Linux one.

on:
  push:
    branches: [main]
  pull_request:

# No job needs to write to the repo (no PR comments, pushes, or releases) —
# default GITHUB_TOKEN permissions are broader than that.
permissions:
  contents: read

jobs:
  lint:
    name: cargo fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo test --workspace
        run: cargo test --workspace

  coverage:
    name: cargo llvm-cov (coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-llvm-cov

      # Measured 92.56% lines / 92.68% regions on the workspace as it
      # stands. The gate sat at 55 for a long time because the baseline
      # was ~58.7%, and that baseline was dragged down by the Slint UI
      # crate — thousands of lines of untested view glue averaged in with
      # the calculation code. With the native front ends gone, every line
      # measured here is core or bridge, and both are tested.
      #
      # Left a few points of headroom so ordinary fluctuation doesn't trip
      # it. This is a regression gate against the coverage the repo
      # already has, not a target to chase — but at 55 it had stopped
      # being even that: coverage could have fallen by thirty-seven points
      # without failing.
      - name: cargo llvm-cov --fail-under-lines
        run: cargo llvm-cov --workspace --fail-under-lines 88

  www-test:
    name: www/ (React) unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: www/package-lock.json

      - run: npm ci
        working-directory: www

      - run: npm test
        working-directory: www

  www-build:
    name: www/ (React + wasm) production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: www-build

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: www/package-lock.json

      - run: npm ci
        working-directory: www

      - run: npm run deploy
        working-directory: www
