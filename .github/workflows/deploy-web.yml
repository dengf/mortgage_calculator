name: Deploy web (mortgage-ui)

# Builds crates/mortgage-ui's web target and publishes it to GitHub Pages.
# Requires enabling Pages once: repo Settings -> Pages -> Source ->
# "GitHub Actions". See crates/mortgage-ui/DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/mortgage-ui -> target

      - name: Install dioxus-cli
        run: cargo install dioxus-cli --locked

      - name: Build release web bundle
        working-directory: crates/mortgage-ui
        run: dx bundle --platform web --package-types web --release

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: crates/mortgage-ui/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
