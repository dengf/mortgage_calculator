# Mortgage Calculator - workspace configuration
#
# Layered architecture: a dependency-free domain-types crate at the bottom,
# pure calculation logic in the middle, and a thin wasm-bindgen crate on top
# that only translates JS <-> Rust and never contains business logic itself.

[workspace]
members = [
    "crates/mortgage-core",
    "crates/mortgage-calc",
    "crates/mortgage-ports",
    "crates/mortgage-ext-redb",
    "crates/mortgage-wasm",
    "crates/mortgage-ui-slint",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Feng Deng"]
license = "MIT"

[workspace.dependencies]
mortgage-core = { path = "crates/mortgage-core" }
mortgage-calc = { path = "crates/mortgage-calc" }
mortgage-ports = { path = "crates/mortgage-ports" }
mortgage-ext-redb = { path = "crates/mortgage-ext-redb" }

rust_decimal = { version = "1.42", features = ["serde", "serde-float", "maths"] }
rust_decimal_macros = "1.40"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"

[profile.release]
# Size, not speed. This is a web app whose payload was 80% wasm binary, and
# nothing here is compute-bound: the heaviest workload in the repo — 312,000
# amortization rows plus 200 Singapore affordability solves, each bisecting
# 60 times through progressive stamp duty — runs in 43ms at opt-level 3 and
# 47ms at "z". A real user generates ~1,560 rows once, so that 11% costs
# roughly a quarter of a millisecond, while the download drops by a third.
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# One-line upstream fix: i-slint-backend-winit 1.17.1's
# try_create_window_with_fallback_renderer() builds an array of renderer
# constructor fn items and calls `.into_iter().find_map(|renderer_factory| ...)`
# on it; with the single #[cfg]-active array element this app's feature
# selection produces (only renderer-femtovg is ever enabled), rustc
# can't infer `renderer_factory`'s type (E0282: type annotations needed).
# Reproduces with a plain `cargo check --target aarch64-apple-ios-sim`
# (confirmed not an Xcode artifact) but not on desktop/wasm/Android
# despite those going through the same unconditional function body —
# root cause of the platform difference not fully tracked down, but the
# fix itself is unambiguous: it's the exact explicit-type annotation
# rustc's own error message suggests, nothing else changed. Vendored
# copy in local-patches/; see local-patches/README.md.
[patch.crates-io]
i-slint-backend-winit = { path = "local-patches/i-slint-backend-winit-1.17.1" }
