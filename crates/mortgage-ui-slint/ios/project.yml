name: Mortgage Calculator
options:
  bundleIdPrefix: io.github.dengf
  deploymentTarget:
    iOS: "16.0"
settings:
  ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  MortgageCalculator:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Mortgage Calculator
        CFBundleIdentifier: io.github.dengf.mortgagecalculator
        UILaunchScreen:
          - ImageRespectSafeAreaInsets: false
        UIUserInterfaceStyle: Dark
    sources:
      - Assets.xcassets
    scheme: {}
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    postCompileScripts:
      - script: |
          ./build_for_ios_with_cargo.bash mortgage-ui-slint
        outputFileLists:
          $TARGET_BUILD_DIR/$EXECUTABLE_PATH
