[package]
name = "mortgage-wasm"
description = "WebAssembly bindings for the mortgage-calculator library"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# wasm-opt stays off, and this is a measured decision rather than an
# inherited default.
#
# The vendored wasm-opt predates rustc emitting `memory.copy`, so it rejects
# the module outright unless --enable-bulk-memory and four more feature flags
# are passed. Supplying them works, but on top of `opt-level = "z"` it is
# worth ~1.5% gzipped — the compressor already removes most of what -Oz
# rewrites. That is not worth a build step that breaks whenever rustc starts
# emitting a proposal the pinned binary has not heard of.
# wasm-opt stays off, and this is now a measured decision rather than an
# inherited default.
#
# The vendored wasm-opt predates rustc emitting `memory.copy`, so it rejects
# the module outright unless --enable-bulk-memory and four further feature
# flags are passed. Supplying them works, but on top of `opt-level = "z"` it
# is worth about 1.5% gzipped — the compressor already removes most of what
# -Oz rewrites. Not worth a build step that breaks whenever rustc starts
# emitting a proposal the pinned binary has not heard of.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
mortgage-core = { workspace = true }
mortgage-calc = { workspace = true }
mortgage-ports = { workspace = true }
mortgage-ext-redb = { workspace = true }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }
rust_decimal = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
