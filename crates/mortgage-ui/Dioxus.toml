[application]

# App (Project) Name
name = "mortgage-ui"

[bundle]

# Reverse-domain app identifier, used for the Android applicationId and
# iOS/macOS bundle ID alike. `com.example.*` (dx's fallback when unset) is
# rejected by both app stores at submission time, so this needs to be a
# real identifier before shipping. dengf's GitHub username is used as a
# placeholder domain component — swap it for your own domain if you have
# one (e.g. com.yourdomain.mortgagecalculator).
identifier = "io.github.dengf.mortgagecalculator"
publisher = "Feng Deng"

# Dioxus App Default Platform
# web, desktop, fullstack
default_platform = "desktop"

# `build` & `serve` dist path
out_dir = "dist"

# assets file folder
asset_dir = "assets"

[web.app]

# HTML title tag content
title = "mortgage-ui"

[web.watcher]

# when watcher trigger, regenerate the `index.html`
reload_html = true

# which files or dirs will be watcher monitoring
watch_path = ["src", "assets"]

# include `assets` in web platform
[web.resource]

# CSS style file

style = []

# Javascript code file
script = []

[web.resource.dev]

# Javascript code file
# serve: [dev-server] only
script = []
