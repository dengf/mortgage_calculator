<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free mortgage calculator for payments, amortization, affordability and refinancing, with Singapore TDSR, CPF and stamp duty built in. Runs entirely in your browser — your numbers never leave your device.">
  <title>Mortgage Calculator — Payments, Amortization, Affordability &amp; Refinance | meifio</title>
  <link rel="canonical" href="https://dengf.github.io/mortgage_calculator/">

  <!-- Each locale gets an addressable URL. Without these the Chinese app is
       invisible to search: it lives at the same URL as the English one and
       only appears after client-side detection, which crawlers don't run. -->
  <link rel="alternate" hreflang="en" href="https://dengf.github.io/mortgage_calculator/">
  <link rel="alternate" hreflang="zh-Hans" href="https://dengf.github.io/mortgage_calculator/?lang=zh-Hans">
  <link rel="alternate" hreflang="zh-Hant" href="https://dengf.github.io/mortgage_calculator/?lang=zh-Hant">
  <link rel="alternate" hreflang="x-default" href="https://dengf.github.io/mortgage_calculator/">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" id="theme-color-meta" content="#0f1720">

  <!-- Open Graph / Twitter need absolute URLs; relative ones are ignored by
       most crawlers, so these can't use the same relative paths as the
       icons above. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="meifio">
  <meta property="og:title" content="Mortgage Calculator — a meifio app">
  <meta property="og:description" content="Payments, amortization, affordability and refinancing, with Singapore TDSR, CPF and stamp duty built in. No accounts, no tracking, no server.">
  <meta property="og:url" content="https://dengf.github.io/mortgage_calculator/">
  <meta property="og:image" content="https://dengf.github.io/mortgage_calculator/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Mortgage Calculator — a meifio app">
  <meta name="twitter:description" content="Payments, amortization, affordability and refinancing, with Singapore TDSR, CPF and stamp duty built in. No accounts, no tracking, no server.">
  <meta name="twitter:image" content="https://dengf.github.io/mortgage_calculator/icon-512.png">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Mortgage Calculator",
    "url": "https://dengf.github.io/mortgage_calculator/",
    "applicationCategory": "FinanceApplication",
    "operatingSystem": "Any",
    "description": "Mortgage payment, amortization, affordability and refinance calculators, with Singapore TDSR/MSR, CPF and BSD/ABSD stamp duty. All calculations run client-side in WebAssembly.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "featureList": [
      "Monthly payment and lifetime cost",
      "Full amortization schedule with extra payments",
      "Affordability from income, debts and down payment",
      "Refinance break-even analysis",
      "Side-by-side comparison of fixed and floating rates",
      "Singapore TDSR/MSR limits, CPF split and BSD/ABSD stamp duty"
    ]
  }
  </script>
  <script>
    // Stamps `data-theme` on <html> from the stored preference (theme.js's
    // `applyTheme`, same key) before this document's own <style> below or
    // main.css ever paint anything -- React doesn't mount until after an
    // async WASM load (see src/index.js), so waiting for its useEffect to
    // do this would flash the wrong theme on the loading screen for
    // however long that takes. Duplicated here rather than imported
    // because this has to run synchronously, inline, before first paint;
    // theme.js's copy is what every later render (a locale switch, the
    // theme picker itself) uses instead.
    (function () {
      var t = null;
      try {
        t = localStorage.getItem('mc:theme');
      } catch (e) {}
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      var isLight = t === 'light' || (t !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches);
      var meta = document.getElementById('theme-color-meta');
      if (meta) meta.setAttribute('content', isLight ? '#f7f8fa' : '#0f1720');
    })();
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f1720;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #root {
      min-height: 100vh;
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 1.2rem;
      color: #7ee787;
    }
    @media (prefers-color-scheme: light) {
      html:not([data-theme='dark']), html:not([data-theme='dark']) body { background-color: #f7f8fa; }
      html:not([data-theme='dark']) body { color: #16202c; }
    }
    html[data-theme='light'], html[data-theme='light'] body { background-color: #f7f8fa; }
    html[data-theme='light'] body { color: #16202c; }
  </style>
</head>
<body>
  <div id="root"><div class="loading">Loading&hellip;</div></div>
</body>
</html>
